[alembic]
# When running from apps/backend directory, use relative path
script_location = alembic
; use environment variable to avoid embedding secrets and shell escaping problems
sqlalchemy.url = env:ALEMBIC_URL

# minimal logging config so fileConfig(...) in env.py won't fail
[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_sqlalchemy]
level = INFO
handlers =
qualname = sqlalchemy.engine
propagate = 0

[logger_alembic]
level = INFO
handlers =
qualname = alembic
propagate = 0

[handler_console]
class = StreamHandler
level = NOTSET
args = (sys.stderr,)

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
