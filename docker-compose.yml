services:
  cloudsql-proxy:
    image: gcr.io/cloudsql-docker/gce-proxy:1.33.1
    env_file: ./apps/backend/.env
    volumes:
      - ./apps/backend/cloudsql:/secrets:ro
      # - ./apps/backend/cloudsql/service-account.json:/secrets/service-account.json:ro
    command:
      - /cloud_sql_proxy
      - -instances=doc-ai-transcript:us-west2:student-transcripts=tcp:0.0.0.0:5432
      - -credential_file=/secrets/service-account.json
    ports:
      - "5432:5432"
    restart: unless-stopped

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    image: transcript-backend:local
    platform: linux/amd64
    depends_on:
      - cloudsql-proxy
    environment:
      PORT: "8080"
      DATABASE_URL: "${DATABASE_URL}"
      GOOGLE_APPLICATION_CREDENTIALS: /app/creds/adc.json
      GOOGLE_CLOUD_PROJECT: doc-ai-transcript
    volumes:
      - ~/.config/gcloud/application_default_credentials.json:/app/creds/adc.json:ro
      
    ports:
      - "8000:8080"

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    image: transcript-frontend:local
    platform: linux/amd64
    depends_on:
      - backend
    environment:
      PORT: "80"
      BACKEND_URL: "http://host.docker.internal:8000"
    ports:
      - "5173:80"
